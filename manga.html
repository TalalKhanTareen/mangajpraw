<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manga - MangaJPRaw</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #080b12;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        header {
            background: #111827;

            border-bottom:
                1px solid #263247;
        }

        .header-inner {
            max-width: 1100px;

            margin: auto;

            padding: 16px 20px;

            display: flex;

            justify-content: space-between;
        }

        header a {
            color: white;

            text-decoration: none;
        }

        .logo {
            font-size: 24px;

            font-weight: bold;
        }

        .logo span {
            color: #ff4d6d;
        }

        .container {
            max-width: 1000px;

            margin: auto;

            padding: 35px 20px 60px;
        }

        .back {
            color: #cbd5e1;

            text-decoration: none;
        }

        .back:hover {
            color: #ff4d6d;
        }

        .manga-header {
            margin-top: 30px;

            background: #111827;

            border:
                1px solid #263247;

            border-radius: 12px;

            padding: 30px;
        }

        h1 {
            margin-top: 0;
        }

        .description {
            color: #9aa7bb;

            line-height: 1.7;
        }

        .meta {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 15px;
        }

        .tag {
            background: #1f2937;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 13px;

            color: #cbd5e1;
        }

        .chapters {
            margin-top: 25px;
        }

        .chapter {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            background: #111827;

            border:
                1px solid #263247;

            border-radius: 8px;

            padding: 15px 18px;

            margin-bottom: 10px;
        }

        .chapter a {
            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        .chapter a:hover {
            color: #ff4d6d;
        }

        .loading,
        .error,
        .empty {
            text-align: center;

            padding: 50px;

            color: #9aa7bb;
        }

        .error {
            color: #ff6b6b;
        }

        @media (max-width: 600px) {

            .chapter {
                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <a
            href="./index.html"
            class="logo"
        >
            Manga<span>JPRaw</span>
        </a>

        <a href="./index.html">
            Home
        </a>

    </div>

</header>


<div class="container">

    <a
        href="./index.html"
        class="back"
    >
        ← Back to Manga
    </a>


    <div id="content">

        <div class="loading">
            Loading manga...
        </div>

    </div>

</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );


    const mangaId =
        params.get("id");


    async function loadManga() {

        const content =
            document.getElementById(
                "content"
            );


        if (!mangaId) {

            content.innerHTML = `
                <div class="error">
                    Manga ID is missing.
                </div>
            `;

            return;

        }


        try {

            const response =
                await fetch(
                    "./data/manga.json?v=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load manga data."
                );

            }


            const data =
                await response.json();


            const manga =
                Array.isArray(data)
                    ? data.find(
                        function(item) {
                            return item.id === mangaId;
                        }
                      )
                    : null;


            if (!manga) {

                content.innerHTML = `
                    <div class="error">
                        Manga not found.
                    </div>
                `;

                return;

            }


            const chapters =
                Array.isArray(
                    manga.chapters
                )
                    ? manga.chapters
                    : [];


            const genres =
                Array.isArray(
                    manga.genres
                )
                    ? manga.genres
                    : [];


            content.innerHTML = `

                <div class="manga-header">

                    <h1>
                        ${escapeHTML(
                            manga.title || "Untitled"
                        )}
                    </h1>

                    ${
                        manga.japaneseTitle
                            ? `
                                <p>
                                    ${escapeHTML(
                                        manga.japaneseTitle
                                    )}
                                </p>
                              `
                            : ""
                    }

                    <p class="description">
                        ${escapeHTML(
                            manga.description || ""
                        )}
                    </p>

                    <div class="meta">

                        ${
                            manga.status
                                ? `
                                    <span class="tag">
                                        ${escapeHTML(
                                            manga.status
                                        )}
                                    </span>
                                  `
                                : ""
                        }

                        ${
                            genres
                                .map(
                                    function(genre) {

                                        return `
                                            <span class="tag">
                                                ${escapeHTML(
                                                    genre
                                                )}
                                            </span>
                                        `;

                                    }
                                )
                                .join("")
                        }

                    </div>

                </div>


                <div class="chapters">

                    <h2>
                        Chapters
                    </h2>

                    ${
                        chapters.length === 0
                            ? `
                                <div class="empty">
                                    No chapters available.
                                </div>
                              `
                            : chapters
                                .slice()
                                .reverse()
                                .map(
                                    function(chapter) {

                                        return `

                                            <div class="chapter">

                                                <a
                                                    href="./chapter.html?id=${encodeURIComponent(manga.id)}&chapter=${encodeURIComponent(chapter.number)}"
                                                >
                                                    ${escapeHTML(
                                                        chapter.title ||
                                                        "Chapter " +
                                                        chapter.number
                                                    )}
                                                </a>

                                                <span>
                                                    ${escapeHTML(
                                                        String(
                                                            chapter.number
                                                        )
                                                    )}
                                                </span>

                                            </div>

                                        `;

                                    }
                                )
                                .join("")

                    }

                </div>

            `;

        }

        catch (error) {

            console.error(error);

            content.innerHTML = `
                <div class="error">
                    Failed to load manga.
                </div>
            `;

        }

    }


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    loadManga();

</script>


</body>

</html>
