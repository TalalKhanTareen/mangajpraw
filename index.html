<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MangaJPRaw - English Manga</title>

    <meta
        name="description"
        content="Read English manga chapters on MangaJPRaw."
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #080b12;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        header {
            background: #111827;

            border-bottom:
                1px solid #263247;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;

            margin: auto;

            padding: 16px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            color: #ffffff;

            text-decoration: none;

            font-size: 25px;

            font-weight: bold;
        }

        .logo span {
            color: #ff4d6d;
        }

        nav {
            display: flex;

            gap: 10px;
        }

        nav a {
            color: #cbd5e1;

            text-decoration: none;

            padding: 9px 13px;

            border-radius: 6px;
        }

        nav a:hover {
            background: #1f2937;

            color: #ffffff;
        }

        .hero {
            max-width: 1200px;

            margin: auto;

            padding: 70px 20px 45px;

            text-align: center;
        }

        .hero h1 {
            font-size: 44px;

            margin: 0 0 15px;
        }

        .hero h1 span {
            color: #ff4d6d;
        }

        .hero p {
            max-width: 650px;

            margin: auto;

            color: #9aa7bb;

            font-size: 17px;

            line-height: 1.7;
        }

        .search-box {
            max-width: 600px;

            margin: 30px auto 0;

            display: flex;

            gap: 10px;
        }

        .search-box input {
            flex: 1;

            padding: 14px 16px;

            background: #111827;

            color: white;

            border:
                1px solid #263247;

            border-radius: 7px;

            outline: none;

            font-size: 15px;
        }

        .search-box input:focus {
            border-color: #ff4d6d;
        }

        .section {
            max-width: 1200px;

            margin: auto;

            padding: 20px;
        }

        .section-title {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .section-title h2 {
            margin: 0;

            font-size: 25px;
        }

        .manga-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .manga-card {
            background: #111827;

            border:
                1px solid #263247;

            border-radius: 10px;

            overflow: hidden;

            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .manga-card:hover {
            transform: translateY(-4px);

            border-color: #ff4d6d;
        }

        .cover {
            width: 100%;

            aspect-ratio: 3 / 4;

            background: #0f172a;

            overflow: hidden;
        }

        .cover img {
            width: 100%;

            height: 100%;

            object-fit: cover;
        }

        .no-cover {
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #64748b;
        }

        .manga-info {
            padding: 15px;
        }

        .manga-info h3 {
            margin:
                0 0 8px;

            font-size: 17px;
        }

        .manga-info h3 a {
            color: white;

            text-decoration: none;
        }

        .manga-info h3 a:hover {
            color: #ff4d6d;
        }

        .status {
            display: inline-block;

            font-size: 12px;

            padding: 4px 8px;

            border-radius: 20px;

            background: #1f2937;

            color: #cbd5e1;
        }

        .genres {
            color: #7f8da3;

            font-size: 12px;

            margin-top: 9px;

            line-height: 1.5;
        }

        .loading,
        .empty,
        .error {
            text-align: center;

            padding: 60px 20px;

            color: #9aa7bb;
        }

        .error {
            color: #ff6b6b;
        }

        footer {
            margin-top: 60px;

            padding: 30px 20px;

            text-align: center;

            color: #7f8da3;

            border-top:
                1px solid #263247;
        }

        @media (max-width: 900px) {

            .manga-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            .header-inner {
                flex-direction: column;

                gap: 10px;
            }

            .hero {
                padding-top: 45px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .manga-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

        }

        @media (max-width: 400px) {

            .manga-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <a
            href="./index.html"
            class="logo"
        >
            Manga<span>JPRaw</span>
        </a>

        <nav>

            <a href="./index.html">
                Home
            </a>

            <a href="./admin/">
                Admin
            </a>

        </nav>

    </div>

</header>


<section class="hero">

    <h1>
        Read <span>English Manga</span>
    </h1>

    <p>
        Discover manga series and read the
        latest available chapters online.
    </p>


    <div class="search-box">

        <input
            type="search"
            id="search"
            placeholder="Search manga..."
        >

    </div>

</section>


<section class="section">

    <div class="section-title">

        <h2>
            Manga Library
        </h2>

    </div>


    <div
        id="manga-list"
        class="manga-grid"
    >

        <div class="loading">
            Loading manga...
        </div>

    </div>

</section>


<footer>

    © 2026 MangaJPRaw

</footer>


<script>

    const DATA_URL =
        "./data/manga.json";


    let allManga = [];


    async function loadManga() {

        const container =
            document.getElementById(
                "manga-list"
            );


        try {

            const response =
                await fetch(
                    DATA_URL +
                    "?v=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load manga data."
                );

            }


            const data =
                await response.json();


            /*
             * Support both:
             *
             * [
             *   {...}
             * ]
             *
             * and:
             *
             * {
             *   "manga": [...]
             * }
             */

            if (Array.isArray(data)) {

                allManga = data;

            }

            else if (
                data &&
                Array.isArray(data.manga)
            ) {

                allManga =
                    data.manga;

            }

            else {

                allManga = [];

            }


            displayManga(
                allManga
            );


        }

        catch (error) {

            console.error(
                error
            );


            container.innerHTML = `
                <div class="error">
                    Failed to load manga.
                </div>
            `;

        }

    }


    function displayManga(
        mangaList
    ) {

        const container =
            document.getElementById(
                "manga-list"
            );


        if (
            !mangaList ||
            mangaList.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">
                    No manga found.
                </div>
            `;

            return;

        }


        container.innerHTML =
            mangaList
                .map(
                    function(manga) {

                        const cover =
                            manga.cover
                                ? `
                                    <img
                                        src="${escapeHTML(manga.cover)}"
                                        alt="${escapeHTML(manga.title || "Manga")}"
                                        onerror="this.parentElement.innerHTML='<div class=&quot;no-cover&quot;>No Cover</div>'"
                                    >
                                  `
                                : `
                                    <div class="no-cover">
                                        No Cover
                                    </div>
                                  `;


                        const genres =
                            Array.isArray(
                                manga.genres
                            )
                                ? manga.genres.join(
                                    ", "
                                  )
                                : "";


                        return `

                            <article class="manga-card">

                                <div class="cover">

                                    ${cover}

                                </div>

                                <div class="manga-info">

                                    <h3>

                                        <a
                                            href="./manga.html?id=${encodeURIComponent(manga.id || "")}"
                                        >
                                            ${escapeHTML(manga.title || "Untitled Manga")}
                                        </a>

                                    </h3>

                                    ${
                                        manga.status
                                            ? `
                                                <span class="status">
                                                    ${escapeHTML(manga.status)}
                                                </span>
                                              `
                                            : ""
                                    }

                                    ${
                                        genres
                                            ? `
                                                <div class="genres">
                                                    ${escapeHTML(genres)}
                                                </div>
                                              `
                                            : ""
                                    }

                                </div>

                            </article>

                        `;

                    }
                )
                .join("");

    }


    document
        .getElementById("search")
        .addEventListener(
            "input",
            function() {

                const query =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!query) {

                    displayManga(
                        allManga
                    );

                    return;

                }


                const filtered =
                    allManga.filter(
                        function(manga) {

                            return (

                                String(
                                    manga.title || ""
                                )
                                    .toLowerCase()
                                    .includes(query)

                                ||

                                String(
                                    manga.japaneseTitle || ""
                                )
                                    .toLowerCase()
                                    .includes(query)

                                ||

                                String(
                                    manga.id || ""
                                )
                                    .toLowerCase()
                                    .includes(query)

                            );

                        }
                    );


                displayManga(
                    filtered
                );

            }
        );


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    loadManga();

</script>


</body>

</html>
