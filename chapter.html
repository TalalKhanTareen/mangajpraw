<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MangaJPRaw - Chapter</title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            background: #111;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {
            min-height: 100vh;
        }


        /* =========================================
           HEADER
           ========================================= */

        .reader-header {

            position: sticky;

            top: 0;

            z-index: 1000;

            width: 100%;

            background: #181818;

            border-bottom:
                1px solid #333;

            padding:
                15px 20px;

            text-align: center;

        }


        .reader-header a {

            color: #fff;

            text-decoration: none;

        }


        #mangaTitle {

            margin:
                0 0 6px;

            font-size:
                22px;

            font-weight:
                700;

        }


        #chapterTitle {

            margin: 0;

            font-size:
                16px;

            font-weight:
                400;

            color: #bbb;

        }


        /* =========================================
           LOADING
           ========================================= */

        #loading {

            width: 100%;

            padding:
                60px 20px;

            text-align: center;

            color: #bbb;

            font-size:
                18px;

        }


        /* =========================================
           ERROR
           ========================================= */

        #errorMessage {

            display: none;

            width: calc(100% - 40px);

            max-width: 700px;

            margin:
                50px auto;

            padding:
                20px;

            background:
                #291818;

            border:
                1px solid #663333;

            color:
                #ffaaaa;

            text-align:
                center;

            line-height:
                1.6;

        }


        /* =========================================
           CHAPTER PAGES
           ========================================= */

        #chapterPages {

            width: 100%;

            max-width:
                1000px;

            margin:
                0 auto;

            padding: 0;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

        }


        .chapter-page {

            display:
                block;

            width:
                100%;

            max-width:
                1000px;

            height:
                auto;

            margin:
                0;

            padding: 0;

        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (
            max-width: 600px
        ) {

            .reader-header {

                padding:
                    12px 10px;

            }


            #mangaTitle {

                font-size:
                    18px;

            }


            #chapterTitle {

                font-size:
                    14px;

            }


            #chapterPages {

                width:
                    100%;

            }


            .chapter-page {

                width:
                    100%;

            }

        }

    </style>

</head>


<body>


<!-- =============================================
     HEADER
     ============================================== -->

<header class="reader-header">

    <a href="./index.html">

        <h1 id="mangaTitle">
            MangaJPRaw
        </h1>

    </a>


    <h2 id="chapterTitle">
        Loading chapter...
    </h2>

</header>


<!-- =============================================
     LOADING
     ============================================== -->

<div id="loading">

    Loading chapter pages...

</div>


<!-- =============================================
     ERROR
     ============================================== -->

<div id="errorMessage"></div>


<!-- =============================================
     CHAPTER PAGES
     ============================================== -->

<main id="chapterPages"></main>


<!-- =============================================
     JAVASCRIPT
     ============================================== -->

<script src="./js/chapter.js?v=20"></script>


</body>

</html>
