<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Read manga chapters on MangaJPRaw"
    >

    <title>MangaJPRaw - Chapter Reader</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           VARIABLES
        ========================= */

        :root {

            --background: #080b12;

            --surface: #111827;

            --surface-two: #151e2e;

            --border: #263247;

            --text: #ffffff;

            --muted: #9aa7bb;

            --accent: #ff4d6d;

            --accent-hover: #ff365a;

        }


        /* =========================
           BODY
        ========================= */

        html {

            scroll-behavior: smooth;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text);

            min-height:
                100vh;

        }


        a {

            color:
                inherit;

            text-decoration:
                none;

        }


        button {

            font-family:
                inherit;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            background:
                rgba(17, 24, 39, 0.96);

            backdrop-filter:
                blur(10px);

            border-bottom:
                1px solid var(--border);

        }


        .navbar {

            max-width:
                1100px;

            margin:
                auto;

            padding:
                16px 20px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

        }


        .logo {

            font-size:
                24px;

            font-weight:
                800;

        }


        .logo span {

            color:
                var(--accent);

        }


        .header-chapter {

            color:
                var(--muted);

            font-size:
                14px;

            text-align:
                right;

        }


        /* =========================
           MAIN
        ========================= */

        .reader-container {

            width:
                100%;

            max-width:
                1000px;

            margin:
                0 auto;

            padding:
                25px 15px 60px;

        }


        /* =========================
           NAVIGATION
        ========================= */

        .navigation {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            margin-bottom:
                25px;

        }


        .button {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            color:
                var(--text);

            padding:
                10px 16px;

            border-radius:
                7px;

            font-size:
                13px;

            cursor:
                pointer;

            transition:
                0.2s;

        }


        .button:hover {

            background:
                var(--surface-two);

            border-color:
                var(--accent);

        }


        .button.disabled {

            opacity:
                0.4;

            pointer-events:
                none;

        }


        /* =========================
           CHAPTER INFORMATION
        ========================= */

        .chapter-info {

            text-align:
                center;

            padding:
                10px 10px 25px;

        }


        .chapter-info h1 {

            font-size:
                30px;

            margin-bottom:
                8px;

        }


        .chapter-info p {

            color:
                var(--muted);

            font-size:
                14px;

        }


        /* =========================
           READER
        ========================= */

        .reader {

            width:
                100%;

            background:
                #000;

            border:
                1px solid var(--border);

            padding:
                4px;

        }


        .page-container {

            width:
                100%;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

        }


        .page {

            display:
                block;

            width:
                100%;

            max-width:
                900px;

            height:
                auto;

            margin:
                0 auto;

            background:
                #111;

            user-select:
                none;

        }


        .page-number {

            width:
                100%;

            padding:
                9px;

            text-align:
                center;

            color:
                var(--muted);

            background:
                #0b0b0b;

            font-size:
                12px;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            width:
                100%;

            min-height:
                300px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            color:
                var(--muted);

        }


        .spinner {

            width:
                42px;

            height:
                42px;

            border:
                4px solid var(--border);

            border-top-color:
                var(--accent);

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;

            margin-bottom:
                18px;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================
           PAGE ERROR
        ========================= */

        .page-error {

            width:
                100%;

            padding:
                50px 20px;

            text-align:
                center;

            color:
                var(--muted);

            background:
                #111;

        }


        .page-error strong {

            display:
                block;

            color:
                white;

            margin-bottom:
                8px;

        }


        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .bottom-navigation {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            margin-top:
                25px;

        }


        /* =========================
           ERROR SCREEN
        ========================= */

        .error-screen {

            min-height:
                500px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            padding:
                30px;

        }


        .error-screen h1 {

            font-size:
                32px;

            margin-bottom:
                15px;

        }


        .error-screen p {

            color:
                var(--muted);

            margin-bottom:
                25px;

        }


        .home-button {

            display:
                inline-flex;

            background:
                var(--accent);

            color:
                white;

            padding:
                11px 20px;

            border-radius:
                7px;

            font-weight:
                bold;

        }


        .home-button:hover {

            background:
                var(--accent-hover);

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            border-top:
                1px solid var(--border);

            background:
                var(--surface);

            text-align:
                center;

            padding:
                30px 20px;

            color:
                var(--muted);

            font-size:
                13px;

        }


        footer strong {

            color:
                white;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {

                padding:
                    13px 15px;

            }


            .logo {

                font-size:
                    20px;

            }


            .header-chapter {

                font-size:
                    12px;

            }


            .reader-container {

                padding:
                    15px 5px 40px;

            }


            .chapter-info h1 {

                font-size:
                    24px;

            }


            .navigation,
            .bottom-navigation {

                padding:
                    0 5px;

            }


            .button {

                padding:
                    9px 11px;

                font-size:
                    12px;

            }


            .reader {

                border-left:
                    none;

                border-right:
                    none;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <nav class="navbar">

            <a
                href="./index.html"
                class="logo"
            >

                Manga<span>JPRaw</span>

            </a>


            <div
                class="header-chapter"
                id="headerChapter"
            >

                Loading...

            </div>

        </nav>

    </header>


    <!-- =========================
         MAIN READER
    ========================= -->

    <main
        class="reader-container"
        id="mainContent"
    >


        <!-- TOP NAVIGATION -->

        <div class="navigation">

            <a
                href="./index.html"
                class="button"
            >

                ← Home

            </a>


            <button
                type="button"
                class="button"
                id="mangaButton"
            >

                Chapters

            </button>

        </div>


        <!-- CHAPTER INFORMATION -->

        <section class="chapter-info">

            <h1 id="chapterTitle">

                Loading...

            </h1>


            <p id="mangaTitle">

                Loading manga...

            </p>

        </section>


        <!-- MANGA READER -->

        <section
            class="reader"
            id="reader"
        >

            <div class="loading">

                <div class="spinner"></div>

                <div>
                    Loading chapter...
                </div>

            </div>

        </section>


        <!-- BOTTOM NAVIGATION -->

        <div class="bottom-navigation">

            <button
                type="button"
                class="button"
                id="previousButton"
            >

                ← Previous

            </button>


            <button
                type="button"
                class="button"
                id="chaptersButton"
            >

                Chapters

            </button>


            <button
                type="button"
                class="button"
                id="nextButton"
            >

                Next →

            </button>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>

            © 2026
            <strong>MangaJPRaw</strong>

        </p>

        <p>

            English Manga Reading Platform

        </p>

    </footer>


    <script>

        /* =========================================
           CONFIGURATION
        ========================================= */

        const REPOSITORY_NAME =
            "mangajpraw";


        const DATA_URL =
            "./data/manga.json";


        /* =========================================
           GLOBAL VARIABLES
        ========================================= */

        let currentManga = null;

        let currentChapter = null;

        let chapters = [];


        /* =========================================
           GET URL PARAMETERS
        ========================================= */

        function getUrlParameters() {

            const parameters =
                new URLSearchParams(
                    window.location.search
                );


            return {

                mangaId:
                    parameters.get("id"),

                chapterNumber:
                    parameters.get("chapter")

            };

        }


        /* =========================================
           BUILD GITHUB PAGES IMAGE URL
        ========================================= */

        function getImageUrl(path) {

            if (!path) {

                return "";

            }


            path =
                String(path).trim();


            /*
             * Already a full URL
             */

            if (
                path.startsWith(
                    "http://"
                ) ||
                path.startsWith(
                    "https://"
                )
            ) {

                return path;

            }


            /*
             * If JSON already contains:
             *
             * /mangajpraw/images/...
             */

            if (
                path.startsWith(
                    "/" + REPOSITORY_NAME + "/"
                )
            ) {

                return path;

            }


            /*
             * If JSON contains:
             *
             * /images/...
             */

            if (
                path.startsWith(
                    "/images/"
                )
            ) {

                return (
                    "/" +
                    REPOSITORY_NAME +
                    path
                );

            }


            /*
             * If JSON contains:
             *
             * images/...
             */

            if (
                path.startsWith(
                    "images/"
                )
            ) {

                return (
                    "/" +
                    REPOSITORY_NAME +
                    "/" +
                    path
                );

            }


            /*
             * If JSON contains:
             *
             * ./images/...
             */

            if (
                path.startsWith(
                    "./images/"
                )
            ) {

                return (
                    "/" +
                    REPOSITORY_NAME +
                    "/" +
                    path.substring(2)
                );

            }


            /*
             * If JSON contains:
             *
             * ../images/...
             */

            if (
                path.startsWith(
                    "../images/"
                )
            ) {

                return (
                    "/" +
                    REPOSITORY_NAME +
                    "/" +
                    path.substring(3)
                );

            }


            /*
             * Fallback
             */

            return (
                "/" +
                REPOSITORY_NAME +
                "/" +
                path.replace(
                    /^\/+/,
                    ""
                )
            );

        }


        /* =========================================
           LOAD MANGA DATA
        ========================================= */

        async function loadChapter() {

            try {

                const parameters =
                    getUrlParameters();


                /*
                 * Check URL
                 */

                if (
                    !parameters.mangaId ||
                    !parameters.chapterNumber
                ) {

                    showError(
                        "Manga ID or chapter number is missing."
                    );

                    return;

                }


                /*
                 * Load JSON
                 */

                const response =
                    await fetch(
                        DATA_URL,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Manga database could not be loaded."
                    );

                }


                const mangaList =
                    await response.json();


                /*
                 * Find manga
                 */

                currentManga =
                    mangaList.find(
                        function(manga) {

                            return (
                                String(
                                    manga.id
                                ) ===
                                String(
                                    parameters.mangaId
                                )
                            );

                        }
                    );


                if (!currentManga) {

                    showError(
                        "Manga was not found."
                    );

                    return;

                }


                /*
                 * Get chapters
                 */

                chapters =
                    Array.isArray(
                        currentManga.chapters
                    )
                        ? currentManga.chapters
                        : [];


                /*
                 * Find chapter
                 */

                currentChapter =
                    chapters.find(
                        function(chapter) {

                            return (
                                String(
                                    chapter.number
                                ) ===
                                String(
                                    parameters.chapterNumber
                                )
                            );

                        }
                    );


                if (!currentChapter) {

                    showError(
                        "Chapter was not found."
                    );

                    return;

                }


                console.log(
                    "Manga loaded:",
                    currentManga
                );


                console.log(
                    "Chapter loaded:",
                    currentChapter
                );


                /*
                 * Display everything
                 */

                displayChapter();

                setupNavigation();


                /*
                 * Browser title
                 */

                document.title =
                    currentManga.title +
                    " - Chapter " +
                    currentChapter.number +
                    " - MangaJPRaw";

            }

            catch (error) {

                console.error(
                    "Chapter loading error:",
                    error
                );


                showError(
                    "Something went wrong while loading the chapter."
                );

            }

        }


        /* =========================================
           DISPLAY CHAPTER
        ========================================= */

        function displayChapter() {

            const chapterTitle =
                currentChapter.title ||
                "Chapter " +
                currentChapter.number;


            /*
             * Header
             */

            document.getElementById(
                "headerChapter"
            ).textContent =
                chapterTitle;


            /*
             * Chapter title
             */

            document.getElementById(
                "chapterTitle"
            ).textContent =
                chapterTitle;


            /*
             * Manga title
             */

            document.getElementById(
                "mangaTitle"
            ).textContent =
                currentManga.title;


            /*
             * Reader
             */

            const reader =
                document.getElementById(
                    "reader"
                );


            /*
             * Get pages
             */

            const pages =
                Array.isArray(
                    currentChapter.pages
                )
                    ? currentChapter.pages
                    : [];


            /*
             * No pages
             */

            if (
                pages.length === 0
            ) {

                reader.innerHTML = `

                    <div class="loading">

                        No pages are available
                        for this chapter.

                    </div>

                `;

                return;

            }


            /*
             * Clear loading screen
             */

            reader.innerHTML = "";


            /*
             * Create page container
             */

            const pageContainer =
                document.createElement(
                    "div"
                );


            pageContainer.className =
                "page-container";


            /*
             * Create every page
             */

            pages.forEach(
                function(
                    pagePath,
                    index
                ) {

                    /*
                     * Create image
                     */

                    const image =
                        document.createElement(
                            "img"
                        );


                    image.className =
                        "page";


                    /*
                     * Build correct URL
                     */

                    const imageUrl =
                        getImageUrl(
                            pagePath
                        );


                    /*
                     * Set image URL
                     */

                    image.src =
                        imageUrl;


                    /*
                     * Alt text
                     */

                    image.alt =
                        currentManga.title +
                        " " +
                        chapterTitle +
                        " Page " +
                        (index + 1);


                    /*
                     * Loading
                     */

                    if (
                        index === 0
                    ) {

                        image.loading =
                            "eager";

                    }
                    else {

                        image.loading =
                            "lazy";

                    }


                    image.decoding =
                        "async";


                    /*
                     * Successful load
                     */

                    image.addEventListener(
                        "load",
                        function() {

                            console.log(
                                "Page loaded successfully:",
                                imageUrl
                            );

                        }
                    );


                    /*
                     * Failed load
                     */

                    image.addEventListener(
                        "error",
                        function() {

                            console.error(
                                "Failed to load page:",
                                imageUrl
                            );


                            const errorBox =
                                document.createElement(
                                    "div"
                                );


                            errorBox.className =
                                "page-error";


                            errorBox.innerHTML = `

                                <strong>
                                    Page ${index + 1} could not be loaded.
                                </strong>

                                <span>
                                    ${escapeHTML(
                                        imageUrl
                                    )}
                                </span>

                            `;


                            image.replaceWith(
                                errorBox
                            );

                        }
                    );


                    /*
                     * Add image
                     */

                    pageContainer.appendChild(
                        image
                    );


                    /*
                     * Page number
                     */

                    const pageNumber =
                        document.createElement(
                            "div"
                        );


                    pageNumber.className =
                        "page-number";


                    pageNumber.textContent =
                        "Page " +
                        (index + 1) +
                        " of " +
                        pages.length;


                    pageContainer.appendChild(
                        pageNumber
                    );

                }
            );


            /*
             * Add container
             */

            reader.appendChild(
                pageContainer
            );

        }


        /* =========================================
           CHAPTER NAVIGATION
        ========================================= */

        function setupNavigation() {

            /*
             * Sort chapters
             */

            const sortedChapters =
                [...chapters].sort(
                    function(a, b) {

                        return (
                            Number(
                                a.number
                            ) -
                            Number(
                                b.number
                            )
                        );

                    }
                );


            /*
             * Current chapter index
             */

            const currentIndex =
                sortedChapters.findIndex(
                    function(chapter) {

                        return (
                            String(
                                chapter.number
                            ) ===
                            String(
                                currentChapter.number
                            )
                        );

                    }
                );


            /*
             * Previous chapter
             */

            const previousChapter =
                sortedChapters[
                    currentIndex - 1
                ];


            /*
             * Next chapter
             */

            const nextChapter =
                sortedChapters[
                    currentIndex + 1
                ];


            /*
             * Buttons
             */

            const previousButton =
                document.getElementById(
                    "previousButton"
                );


            const nextButton =
                document.getElementById(
                    "nextButton"
                );


            /*
             * Previous
             */

            if (
                previousChapter
            ) {

                previousButton.classList.remove(
                    "disabled"
                );


                previousButton.onclick =
                    function() {

                        openChapter(
                            previousChapter.number
                        );

                    };

            }
            else {

                previousButton.classList.add(
                    "disabled"
                );

            }


            /*
             * Next
             */

            if (
                nextChapter
            ) {

                nextButton.classList.remove(
                    "disabled"
                );


                nextButton.onclick =
                    function() {

                        openChapter(
                            nextChapter.number
                        );

                    };

            }
            else {

                nextButton.classList.add(
                    "disabled"
                );

            }


            /*
             * Manga page URL
             */

            const mangaUrl =
                "./manga.html?id=" +
                encodeURIComponent(
                    currentManga.id
                );


            /*
             * Top chapters button
             */

            document.getElementById(
                "mangaButton"
            ).onclick =
                function() {

                    window.location.href =
                        mangaUrl;

                };


            /*
             * Bottom chapters button
             */

            document.getElementById(
                "chaptersButton"
            ).onclick =
                function() {

                    window.location.href =
                        mangaUrl;

                };

        }


        /* =========================================
           OPEN CHAPTER
        ========================================= */

        function openChapter(
            chapterNumber
        ) {

            const url =
                "./chapter.html?id=" +
                encodeURIComponent(
                    currentManga.id
                ) +
                "&chapter=" +
                encodeURIComponent(
                    chapterNumber
                );


            window.location.href =
                url;

        }


        /* =========================================
           ERROR SCREEN
        ========================================= */

        function showError(
            message
        ) {

            const main =
                document.getElementById(
                    "mainContent"
                );


            main.innerHTML = `

                <div class="error-screen">

                    <h1>
                        Oops!
                    </h1>

                    <p>
                        ${escapeHTML(
                            message
                        )}
                    </p>

                    <a
                        href="./index.html"
                        class="home-button"
                    >
                        Back to Home
                    </a>

                </div>

            `;

        }


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHTML(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================
           START APPLICATION
        ========================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadChapter();

            }
        );

    </script>

</body>

</html>
