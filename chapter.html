<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chapter - MangaJPRaw</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #080b12;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        header {
            background: #111827;

            border-bottom:
                1px solid #263247;
        }

        .header-inner {
            max-width: 1000px;

            margin: auto;

            padding: 15px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        header a {
            color: white;

            text-decoration: none;
        }

        .logo {
            font-size: 24px;

            font-weight: bold;
        }

        .logo span {
            color: #ff4d6d;
        }

        .container {
            max-width: 1000px;

            margin: auto;

            padding: 20px 10px 50px;
        }

        .top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;
        }

        .back,
        button {
            background: #111827;

            color: white;

            border:
                1px solid #263247;

            padding: 9px 14px;

            border-radius: 6px;

            text-decoration: none;

            cursor: pointer;
        }

        .back:hover,
        button:hover {
            border-color: #ff4d6d;
        }

        h1 {
            text-align: center;

            margin: 15px 0 5px;
        }

        .subtitle {
            text-align: center;

            color: #9aa7bb;

            margin-bottom: 25px;
        }

        #reader {
            background: #000;

            text-align: center;
        }

        .page {
            margin: 0 auto;
        }

        .page img {
            display: block;

            width: 100%;

            max-width: 900px;

            height: auto;

            margin: 0 auto;
        }

        .page-number {
            padding: 10px;

            background: #080808;

            color: #9aa7bb;
        }

        .loading,
        .error {
            padding: 70px 20px;

            text-align: center;

            color: #9aa7bb;
        }

        .error {
            color: #ff6b6b;
        }

        .navigation {
            display: flex;

            justify-content: space-between;

            margin-top: 20px;

            gap: 10px;
        }

        @media (max-width: 600px) {

            .navigation {
                flex-direction: column;
            }

            .top {
                flex-direction: column;

                align-items: stretch;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-inner">

        <a
            href="./index.html"
            class="logo"
        >
            Manga<span>JPRaw</span>
        </a>

        <a href="./index.html">
            Home
        </a>

    </div>

</header>


<div class="container">


    <div class="top">

        <a
            href="./index.html"
            class="back"
        >
            ← Home
        </a>

        <a
            id="chaptersLink"
            href="./index.html"
            class="back"
        >
            Chapters
        </a>

    </div>


    <h1 id="chapterTitle">
        Loading...
    </h1>


    <div
        id="mangaTitle"
        class="subtitle"
    ></div>


    <div id="reader">

        <div class="loading">
            Loading chapter...
        </div>

    </div>


    <div class="navigation">

        <button id="previous">
            ← Previous
        </button>

        <button id="next">
            Next →
        </button>

    </div>


</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );


    const mangaId =
        params.get("id");


    const chapterNumber =
        params.get("chapter");


    let chapters = [];

    let currentIndex = -1;


    async function loadChapter() {

        const reader =
            document.getElementById(
                "reader"
            );


        if (
            !mangaId ||
            !chapterNumber
        ) {

            reader.innerHTML = `
                <div class="error">
                    Manga or chapter information is missing.
                </div>
            `;

            return;

        }


        try {

            const response =
                await fetch(
                    "./data/manga.json?v=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load manga data."
                );

            }


            const data =
                await response.json();


            const manga =
                data.find(
                    function(item) {

                        return (
                            item.id ===
                            mangaId
                        );

                    }
                );


            if (!manga) {

                throw new Error(
                    "Manga not found."
                );

            }


            chapters =
                Array.isArray(
                    manga.chapters
                )
                    ? manga.chapters
                    : [];


            currentIndex =
                chapters.findIndex(
                    function(chapter) {

                        return String(
                            chapter.number
                        ) === String(
                            chapterNumber
                        );

                    }
                );


            if (
                currentIndex === -1
            ) {

                throw new Error(
                    "Chapter not found."
                );

            }


            const chapter =
                chapters[
                    currentIndex
                ];


            document.title =
                manga.title +
                " - " +
                (
                    chapter.title ||
                    "Chapter " +
                    chapter.number
                );


            document
                .getElementById(
                    "chapterTitle"
                )
                .textContent =
                    chapter.title ||
                    "Chapter " +
                    chapter.number;


            document
                .getElementById(
                    "mangaTitle"
                )
                .textContent =
                    manga.title;


            document
                .getElementById(
                    "chaptersLink"
                )
                .href =
                    "./manga.html?id=" +
                    encodeURIComponent(
                        manga.id
                    );


            displayPages(
                chapter.pages || []
            );


            updateNavigation();

        }

        catch (error) {

            console.error(
                error
            );

            reader.innerHTML = `
                <div class="error">
                    ${escapeHTML(
                        error.message
                    )}
                </div>
            `;

        }

    }


    function displayPages(
        pages
    ) {

        const reader =
            document.getElementById(
                "reader"
            );


        if (
            !Array.isArray(pages) ||
            pages.length === 0
        ) {

            reader.innerHTML = `
                <div class="error">
                    No pages found for this chapter.
                </div>
            `;

            return;

        }


        reader.innerHTML = "";


        pages.forEach(
            function(path, index) {

                const page =
                    document.createElement(
                        "div"
                    );


                page.className =
                    "page";


                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    path;


                image.alt =
                    "Page " +
                    (index + 1);


                image.loading =
                    "lazy";


                image.onerror =
                    function() {

                        page.innerHTML = `
                            <div class="error">
                                Page ${
                                    index + 1
                                } could not be loaded.
                            </div>
                        `;

                    };


                page.appendChild(
                    image
                );


                const number =
                    document.createElement(
                        "div"
                    );


                number.className =
                    "page-number";


                number.textContent =
                    "Page " +
                    (index + 1) +
                    " of " +
                    pages.length;


                page.appendChild(
                    number
                );


                reader.appendChild(
                    page
                );

            }
        );

    }


    function updateNavigation() {

        const previous =
            document.getElementById(
                "previous"
            );


        const next =
            document.getElementById(
                "next"
            );


        previous.disabled =
            currentIndex <= 0;


        next.disabled =
            currentIndex >=
            chapters.length - 1;

    }


    document
        .getElementById("previous")
        .addEventListener(
            "click",
            function() {

                if (
                    currentIndex > 0
                ) {

                    const chapter =
                        chapters[
                            currentIndex - 1
                        ];

                    window.location.href =
                        "./chapter.html?id=" +
                        encodeURIComponent(
                            mangaId
                        ) +
                        "&chapter=" +
                        encodeURIComponent(
                            chapter.number
                        );

                }

            }
        );


    document
        .getElementById("next")
        .addEventListener(
            "click",
            function() {

                if (
                    currentIndex <
                    chapters.length - 1
                ) {

                    const chapter =
                        chapters[
                            currentIndex + 1
                        ];

                    window.location.href =
                        "./chapter.html?id=" +
                        encodeURIComponent(
                            mangaId
                        ) +
                        "&chapter=" +
                        encodeURIComponent(
                            chapter.number
                        );

                }

            }
        );


    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    loadChapter();

</script>


</body>

</html>
