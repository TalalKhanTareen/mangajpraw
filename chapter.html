<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Read manga chapters online"
    >

    <title>Chapter - MangaJPRaw</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #080b12;
            --surface: #111827;
            --surface-2: #151e2e;
            --border: #263247;

            --text: #ffffff;
            --muted: #9aa7bb;

            --accent: #ff4d6d;
            --accent-hover: #ff365a;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text);

            min-height:
                100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background:
                rgba(17, 24, 39, 0.96);

            backdrop-filter:
                blur(10px);

            border-bottom:
                1px solid var(--border);
        }

        .navbar {
            max-width: 1100px;
            margin: auto;

            padding: 16px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: var(--accent);
        }

        .chapter-title {
            color: var(--muted);
            font-size: 14px;
            text-align: right;
        }

        /* =========================
           READER CONTAINER
        ========================= */

        .reader-container {
            max-width: 1000px;
            margin: auto;

            padding:
                25px 15px 60px;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 25px;
        }

        .control-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            padding:
                10px 16px;

            border-radius:
                7px;

            color:
                white;

            font-size:
                13px;

            cursor:
                pointer;

            transition:
                0.2s;
        }

        .control-button:hover {
            background:
                var(--surface-2);

            border-color:
                var(--accent);
        }

        .control-button.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* =========================
           CHAPTER INFO
        ========================= */

        .chapter-info {
            text-align: center;

            padding:
                15px 10px 25px;
        }

        .chapter-info h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .chapter-info p {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           READER
        ========================= */

        .reader {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 4px;

            background:
                #000;

            border:
                1px solid var(--border);

            padding:
                4px;
        }

        .page {
            display: block;

            width: 100%;
            max-width: 900px;

            height: auto;

            margin: 0 auto;

            background: #111;

            user-select: none;
        }

        .page-number {
            width: 100%;

            text-align: center;

            padding: 8px;

            color: var(--muted);

            font-size: 12px;

            background: #0b0b0b;
        }

        .page-error {
            width: 100%;

            padding: 30px 15px;

            text-align: center;

            color: var(--muted);

            background: #111;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;

            padding:
                100px 20px;

            color:
                var(--muted);

            width: 100%;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;

            margin:
                0 auto 20px;

            border:
                4px solid var(--border);

            border-top-color:
                var(--accent);

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }

        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .bottom-navigation {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-top: 25px;
        }

        /* =========================
           ERROR
        ========================= */

        .error {
            text-align: center;

            padding:
                100px 20px;
        }

        .error h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .error p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;

            background:
                var(--accent);

            padding:
                11px 20px;

            border-radius:
                7px;

            font-weight:
                bold;
        }

        .home-button:hover {
            background:
                var(--accent-hover);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top:
                1px solid var(--border);

            background:
                var(--surface);

            text-align:
                center;

            padding:
                30px 20px;

            color:
                var(--muted);

            font-size:
                13px;
        }

        footer strong {
            color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                padding:
                    13px 15px;
            }

            .logo {
                font-size:
                    20px;
            }

            .chapter-title {
                font-size:
                    12px;
            }

            .reader-container {
                padding:
                    15px 5px 40px;
            }

            .chapter-info {
                padding:
                    15px 5px 25px;
            }

            .chapter-info h1 {
                font-size:
                    24px;
            }

            .navigation,
            .bottom-navigation {
                padding:
                    0 5px;
            }

            .control-button {
                padding:
                    9px 11px;

                font-size:
                    12px;
            }

            .reader {
                border-left:
                    none;

                border-right:
                    none;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <nav class="navbar">

            <a
                href="./index.html"
                class="logo"
            >
                Manga<span>JPRaw</span>
            </a>

            <div
                class="chapter-title"
                id="headerChapter"
            >
                Loading...
            </div>

        </nav>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main
        class="reader-container"
        id="mainContent"
    >


        <!-- TOP NAVIGATION -->

        <div class="navigation">

            <a
                href="./index.html"
                class="control-button"
            >
                ← Home
            </a>


            <button
                class="control-button"
                id="backToManga"
            >
                Chapters
            </button>

        </div>


        <!-- CHAPTER INFORMATION -->

        <section class="chapter-info">

            <h1 id="chapterHeading">
                Loading...
            </h1>

            <p id="chapterSubheading">
                Loading chapter...
            </p>

        </section>


        <!-- READER -->

        <section
            class="reader"
            id="reader"
        >

            <div class="loading">

                <div
                    class="loading-spinner"
                ></div>

                Loading chapter...

            </div>

        </section>


        <!-- BOTTOM NAVIGATION -->

        <div class="bottom-navigation">

            <button
                class="control-button"
                id="previousChapter"
            >
                ← Previous
            </button>


            <button
                class="control-button"
                id="backToMangaBottom"
            >
                Chapters
            </button>


            <button
                class="control-button"
                id="nextChapter"
            >
                Next →
            </button>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>
            © 2026
            <strong>MangaJPRaw</strong>
        </p>

        <p>
            English Manga Reading Platform
        </p>

    </footer>


    <script>

        const DATA_URL = "./data/manga.json";


        let currentManga = null;
        let currentChapter = null;
        let chapters = [];


        /* =========================
           URL PARAMETERS
        ========================= */

        function getParameters() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return {

                mangaId:
                    params.get("id"),

                chapterNumber:
                    params.get("chapter")

            };

        }


        /* =========================
           RESOLVE IMAGE URL
        ========================= */

        function resolvePageUrl(page) {

            if (!page) {
                return "";
            }


            page = String(page).trim();


            /*
             * External image
             */

            if (
                page.startsWith("http://") ||
                page.startsWith("https://")
            ) {

                return page;

            }


            /*
             * Root-relative path
             *
             * /images/one-piece/1187/001.jpg
             */

            if (page.startsWith("/")) {

                return "." + page;

            }


            /*
             * Data-relative path
             *
             * ../images/one-piece/1187/001.jpg
             */

            if (page.startsWith("../")) {

                return page.substring(3);

            }


            /*
             * Current-directory path
             *
             * ./images/...
             */

            if (page.startsWith("./")) {

                return page.substring(2);

            }


            /*
             * Plain path
             *
             * images/...
             */

            return page;

        }


        /* =========================
           LOAD CHAPTER
        ========================= */

        async function loadChapter() {

            try {

                const params =
                    getParameters();


                if (
                    !params.mangaId ||
                    !params.chapterNumber
                ) {

                    showError(
                        "Manga or chapter was not specified."
                    );

                    return;

                }


                const response =
                    await fetch(
                        DATA_URL,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load manga database."
                    );

                }


                const mangaList =
                    await response.json();


                currentManga =
                    mangaList.find(
                        manga =>
                            String(manga.id) ===
                            String(params.mangaId)
                    );


                if (!currentManga) {

                    showError(
                        "Manga not found."
                    );

                    return;

                }


                chapters =
                    Array.isArray(
                        currentManga.chapters
                    )
                        ? currentManga.chapters
                        : [];


                currentChapter =
                    chapters.find(
                        chapter =>
                            String(
                                chapter.number
                            ) ===
                            String(
                                params.chapterNumber
                            )
                    );


                if (!currentChapter) {

                    showError(
                        "Chapter not found."
                    );

                    return;

                }


                console.log(
                    "Manga loaded:",
                    currentManga
                );


                console.log(
                    "Chapter loaded:",
                    currentChapter
                );


                displayChapter();

                setupNavigation();


                document.title =
                    `${currentManga.title} - ${getChapterTitle()} - MangaJPRaw`;


            } catch (error) {

                console.error(
                    "Reader error:",
                    error
                );


                showError(
                    "Unable to load this chapter."
                );

            }

        }


        /* =========================
           CHAPTER TITLE
        ========================= */

        function getChapterTitle() {

            return (
                currentChapter.title ||
                `Chapter ${currentChapter.number}`
            );

        }


        /* =========================
           DISPLAY CHAPTER
        ========================= */

        function displayChapter() {

            const title =
                getChapterTitle();


            document.getElementById(
                "chapterHeading"
            ).textContent =
                title;


            document.getElementById(
                "chapterSubheading"
            ).textContent =
                currentManga.title;


            document.getElementById(
                "headerChapter"
            ).textContent =
                title;


            const reader =
                document.getElementById(
                    "reader"
                );


            const pages =
                Array.isArray(
                    currentChapter.pages
                )
                    ? currentChapter.pages
                    : [];


            if (pages.length === 0) {

                reader.innerHTML = `

                    <div class="loading">

                        No pages are available
                        for this chapter yet.

                    </div>

                `;

                return;

            }


            reader.innerHTML = "";


            pages.forEach(
                function(page, index) {

                    const image =
                        document.createElement(
                            "img"
                        );


                    image.className =
                        "page";


                    image.src =
                        resolvePageUrl(page);


                    image.alt =
                        `${currentManga.title} - ${title} - Page ${index + 1}`;


                    /*
                     * First page loads immediately.
                     * Remaining pages load lazily.
                     */

                    image.loading =
                        index === 0
                            ? "eager"
                            : "lazy";


                    image.decoding =
                        "async";


                    image.addEventListener(
                        "error",
                        function() {

                            console.error(
                                "Failed to load page:",
                                page
                            );


                            const error =
                                document.createElement(
                                    "div"
                                );


                            error.className =
                                "page-error";


                            error.innerHTML = `
                                Page ${index + 1}
                                could not be loaded.
                            `;


                            image.replaceWith(
                                error
                            );

                        }
                    );


                    reader.appendChild(
                        image
                    );


                    const pageNumber =
                        document.createElement(
                            "div"
                        );


                    pageNumber.className =
                        "page-number";


                    pageNumber.textContent =
                        `Page ${index + 1} of ${pages.length}`;


                    reader.appendChild(
                        pageNumber
                    );

                }
            );

        }


        /* =========================
           NAVIGATION
        ========================= */

        function setupNavigation() {

            const sorted =
                [...chapters].sort(
                    function(a, b) {

                        return (
                            Number(a.number) -
                            Number(b.number)
                        );

                    }
                );


            const currentIndex =
                sorted.findIndex(
                    chapter =>
                        String(
                            chapter.number
                        ) ===
                        String(
                            currentChapter.number
                        )
                );


            const previous =
                sorted[
                    currentIndex - 1
                ];


            const next =
                sorted[
                    currentIndex + 1
                ];


            const previousButton =
                document.getElementById(
                    "previousChapter"
                );


            const nextButton =
                document.getElementById(
                    "nextChapter"
                );


            if (previous) {

                previousButton.classList.remove(
                    "disabled"
                );


                previousButton.onclick =
                    function() {

                        goToChapter(
                            previous.number
                        );

                    };

            } else {

                previousButton.classList.add(
                    "disabled"
                );

            }


            if (next) {

                nextButton.classList.remove(
                    "disabled"
                );


                nextButton.onclick =
                    function() {

                        goToChapter(
                            next.number
                        );

                    };

            } else {

                nextButton.classList.add(
                    "disabled"
                );

            }


            const mangaUrl =
                `./manga.html?id=${encodeURIComponent(
                    currentManga.id
                )}`;


            document.getElementById(
                "backToManga"
            ).onclick =
                function() {

                    window.location.href =
                        mangaUrl;

                };


            document.getElementById(
                "backToMangaBottom"
            ).onclick =
                function() {

                    window.location.href =
                        mangaUrl;

                };

        }


        /* =========================
           GO TO CHAPTER
        ========================= */

        function goToChapter(number) {

            window.location.href =
                `./chapter.html?id=${encodeURIComponent(
                    currentManga.id
                )}&chapter=${encodeURIComponent(
                    number
                )}`;

        }


        /* =========================
           ERROR PAGE
        ========================= */

        function showError(message) {

            const main =
                document.getElementById(
                    "mainContent"
                );


            main.innerHTML = `

                <div class="error">

                    <h1>
                        Oops!
                    </h1>


                    <p>
                        ${escapeHTML(
                            message
                        )}
                    </p>


                    <a
                        href="./index.html"
                        class="home-button"
                    >

                        Back to Home

                    </a>

                </div>

            `;

        }


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           START
        ========================= */

        document.addEventListener(
            "DOMContentLoaded",
            loadChapter
        );

    </script>

</body>

</html>
