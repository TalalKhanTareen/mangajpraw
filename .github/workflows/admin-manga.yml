name: Admin Manga Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Admin action"
        required: true
        type: choice
        options:
          - add-chapter

      manga_id:
        description: "Manga ID"
        required: true
        type: string

      chapter_number:
        description: "Chapter number"
        required: true
        type: string

      chapter_title:
        description: "Chapter title"
        required: false
        type: string

      chapter_description:
        description: "Chapter description"
        required: false
        type: string

      release_date:
        description: "Release date"
        required: false
        type: string

permissions:
  contents: write

jobs:

  manage-manga:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Add chapter
        if: ${{ github.event.inputs.action == 'add-chapter' }}
        env:
          MANGA_ID: ${{ github.event.inputs.manga_id }}
          CHAPTER_NUMBER: ${{ github.event.inputs.chapter_number }}
          CHAPTER_TITLE: ${{ github.event.inputs.chapter_title }}
          CHAPTER_DESCRIPTION: ${{ github.event.inputs.chapter_description }}
          RELEASE_DATE: ${{ github.event.inputs.release_date }}
        run: |

          python <<'PY'

          import json
          import os
          import sys

          FILE = "data/manga.json"

          manga_id = os.environ["MANGA_ID"]
          chapter_number = os.environ["CHAPTER_NUMBER"]
          chapter_title = os.environ.get("CHAPTER_TITLE", "").strip()
          chapter_description = os.environ.get("CHAPTER_DESCRIPTION", "").strip()
          release_date = os.environ.get("RELEASE_DATE", "").strip()

          # ----------------------------------------
          # LOAD DATA
          # ----------------------------------------

          with open(FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          # ----------------------------------------
          # FIND MANGA
          # ----------------------------------------

          manga = None

          for item in data:
              if str(item.get("id")) == manga_id:
                  manga = item
                  break

          if manga is None:
              print(f"Manga not found: {manga_id}")
              sys.exit(1)

          # ----------------------------------------
          # CREATE CHAPTER ARRAY
          # ----------------------------------------

          if "chapters" not in manga:
              manga["chapters"] = []

          # ----------------------------------------
          # CHECK DUPLICATE
          # ----------------------------------------

          for chapter in manga["chapters"]:

              if str(chapter.get("number")) == str(chapter_number):

                  print(
                      f"Chapter {chapter_number} already exists."
                  )

                  sys.exit(1)

          # ----------------------------------------
          # CREATE CHAPTER
          # ----------------------------------------

          try:
              number = float(chapter_number)

              if number.is_integer():
                  number = int(number)

          except ValueError:

              print("Invalid chapter number.")

              sys.exit(1)

          chapter = {

              "id": str(chapter_number),

              "number": number,

              "title":
                  chapter_title
                  or f"Chapter {chapter_number}",

              "description":
                  chapter_description,

              "releaseDate":
                  release_date,

              "pages": []

          }

          # ----------------------------------------
          # ADD CHAPTER
          # ----------------------------------------

          manga["chapters"].append(chapter)

          # ----------------------------------------
          # SORT CHAPTERS
          # ----------------------------------------

          manga["chapters"].sort(
              key=lambda x: float(x.get("number", 0))
          )

          # ----------------------------------------
          # SAVE JSON
          # ----------------------------------------

          with open(FILE, "w", encoding="utf-8") as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

              f.write("\n")

          print(
              f"Chapter {chapter_number} added to {manga_id}"
          )

          PY

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/manga.json

          git diff --cached --quiet || \
            git commit -m "Admin: add chapter"

          git push
