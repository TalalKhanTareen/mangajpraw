<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Manga - MangaJPRaw</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <style>

        body {
            display: block;
        }

        .page {
            max-width: 850px;

            margin: auto;

            padding: 30px 20px 60px;
        }

        .topbar {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        .topbar a {
            color: white;

            text-decoration: none;
        }

        .form-card {
            background: #111827;

            border:
                1px solid #263247;

            border-radius: 12px;

            padding: 30px;
        }

        .form-card h1 {
            margin-top: 0;

            text-align: left;
        }

        .description {
            color: #9aa7bb;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
        }

        textarea {
            min-height: 130px;

            resize: vertical;
        }

        .help {
            color: #7f8da3;

            font-size: 12px;

            margin-top: 6px;
        }

        .actions {
            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        .actions button,
        .actions a {
            flex: 1;
        }

        .cancel {
            display: flex;

            align-items: center;

            justify-content: center;

            background: #1f2937;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            border:
                1px solid #374151;
        }

        .cancel:hover {
            background: #374151;
        }

        @media (max-width: 600px) {

            .form-card {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <div class="topbar">

        <a href="./dashboard.html">
            ← Dashboard
        </a>

        <button
            id="logoutButton"
            style="
                width:auto;
                padding:10px 16px;
                background:#1f2937;
                border:1px solid #374151;
            "
        >
            Logout
        </button>

    </div>


    <div class="form-card">

        <h1>
            Add New Manga
        </h1>

        <p class="description">
            Enter the manga information below.
        </p>


        <form id="mangaForm">


            <div class="form-group">

                <label for="mangaId">
                    Manga ID *
                </label>

                <input
                    type="text"
                    id="mangaId"
                    placeholder="one-piece"
                    required
                >

                <div class="help">
                    Lowercase letters, numbers and
                    hyphens only.
                </div>

            </div>


            <div class="form-group">

                <label for="title">
                    Manga Title *
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="One Piece"
                    required
                >

            </div>


            <div class="form-group">

                <label for="japaneseTitle">
                    Japanese Title
                </label>

                <input
                    type="text"
                    id="japaneseTitle"
                    placeholder="ワンピース"
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description *
                </label>

                <textarea
                    id="description"
                    placeholder="Manga description..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="status">
                    Status *
                </label>

                <select
                    id="status"
                    required
                >

                    <option value="">
                        Select status
                    </option>

                    <option value="Ongoing">
                        Ongoing
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Hiatus">
                        Hiatus
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="genres">
                    Genres *
                </label>

                <input
                    type="text"
                    id="genres"
                    placeholder="Action, Adventure, Fantasy"
                    required
                >

            </div>


            <div class="form-group">

                <label for="cover">
                    Cover Image Path
                </label>

                <input
                    type="text"
                    id="cover"
                    placeholder="images/covers/example.jpg"
                >

            </div>


            <div class="actions">

                <a
                    href="./dashboard.html"
                    class="cancel"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    id="saveButton"
                >
                    Save Manga
                </button>

            </div>


        </form>


        <div
            id="message"
            class="message"
        ></div>


    </div>

</div>


<script>

    const OWNER =
        "TalalKhanTareen";

    const REPOSITORY =
        "mangajpraw";

    const WORKFLOW =
        "admin-manga.yml";

    const BRANCH =
        "main";


    const token =
        sessionStorage.getItem(
            "mangajpraw_token"
        );


    const loggedIn =
        sessionStorage.getItem(
            "mangajpraw_admin"
        );


    if (
        loggedIn !== "true" ||
        !token
    ) {

        window.location.href =
            "./index.html";

    }


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            function() {

                sessionStorage.clear();

                window.location.href =
                    "./index.html";

            }
        );


    document
        .getElementById("mangaForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const message =
                    document.getElementById(
                        "message"
                    );


                const button =
                    document.getElementById(
                        "saveButton"
                    );


                const id =
                    document
                        .getElementById("mangaId")
                        .value
                        .trim()
                        .toLowerCase();


                const title =
                    document
                        .getElementById("title")
                        .value
                        .trim();


                const japaneseTitle =
                    document
                        .getElementById("japaneseTitle")
                        .value
                        .trim();


                const description =
                    document
                        .getElementById("description")
                        .value
                        .trim();


                const status =
                    document
                        .getElementById("status")
                        .value;


                const genresText =
                    document
                        .getElementById("genres")
                        .value
                        .trim();


                const cover =
                    document
                        .getElementById("cover")
                        .value
                        .trim();


                if (
                    !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(id)
                ) {

                    showError(
                        "Manga ID is invalid."
                    );

                    return;

                }


                const genres =
                    genresText
                        .split(",")
                        .map(
                            function(item) {
                                return item.trim();
                            }
                        )
                        .filter(
                            function(item) {
                                return item.length > 0;
                            }
                        );


                if (
                    genres.length === 0
                ) {

                    showError(
                        "Enter at least one genre."
                    );

                    return;

                }


                const manga = {

                    id: id,

                    title: title,

                    japaneseTitle:
                        japaneseTitle,

                    description:
                        description,

                    status:
                        status,

                    genres:
                        genres,

                    cover:
                        cover,

                    chapters: []

                };


                button.disabled =
                    true;

                button.textContent =
                    "Saving...";


                message.textContent =
                    "Starting GitHub workflow...";

                message.className =
                    "message";


                try {

                    const url =
                        "https://api.github.com/repos/" +
                        OWNER +
                        "/" +
                        REPOSITORY +
                        "/actions/workflows/" +
                        WORKFLOW +
                        "/dispatches";


                    const response =
                        await fetch(
                            url,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Authorization":
                                        "Bearer " +
                                        token,

                                    "Accept":
                                        "application/vnd.github+json",

                                    "Content-Type":
                                        "application/json",

                                    "X-GitHub-Api-Version":
                                        "2022-11-28"

                                },

                                body:
                                    JSON.stringify({

                                        ref:
                                            BRANCH,

                                        inputs: {

                                            action:
                                                "add_manga",

                                            manga_data:
                                                JSON.stringify(
                                                    manga
                                                )

                                        }

                                    })

                            }
                        );


                    if (
                        response.status !== 204
                    ) {

                        let errorMessage =
                            "GitHub rejected the request.";


                        try {

                            const error =
                                await response.json();

                            if (
                                error.message
                            ) {

                                errorMessage +=
                                    " " +
                                    error.message;

                            }

                        }

                        catch {

                        }


                        throw new Error(
                            errorMessage
                        );

                    }


                    message.innerHTML = `
                        <strong>
                            Manga submitted successfully.
                        </strong>
                        <br><br>
                        GitHub Actions is now updating
                        manga.json. Check the Actions tab
                        for the workflow result.
                    `;

                    message.className =
                        "message success";


                    document
                        .getElementById("mangaForm")
                        .reset();

                }

                catch (error) {

                    console.error(
                        error
                    );

                    showError(
                        error.message
                    );

                }

                finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Save Manga";

                }

            }
        );


    function showError(
        text
    ) {

        const message =
            document.getElementById(
                "message"
            );

        message.textContent =
            text;

        message.className =
            "message error";

    }

</script>


</body>

</html>
