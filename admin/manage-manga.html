<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Manga - MangaJPRaw</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <style>

        .manage-container {

            max-width: 1100px;

            margin: 0 auto;

            padding: 30px 20px;

        }


        .manage-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;

        }


        .back-button {

            display: inline-block;

            padding:
                10px 16px;

            background: #333;

            color: #fff;

            text-decoration: none;

            border-radius: 6px;

        }


        .manga-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;

        }


        .manga-card {

            background: #fff;

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 20px;

            box-shadow:
                0 3px 10px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .manga-card h3 {

            margin-top: 0;

            margin-bottom: 8px;

        }


        .manga-id {

            font-size: 13px;

            color: #777;

            margin-bottom: 12px;

        }


        .manga-description {

            color: #555;

            line-height: 1.5;

            margin-bottom: 15px;

        }


        .manga-info {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 15px;

        }


        .badge {

            padding:
                5px 9px;

            background: #eee;

            border-radius: 5px;

            font-size: 13px;

        }


        .status {

            font-weight: 600;

        }


        .chapter-count {

            color: #555;

        }


        .card-actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .card-actions button {

            border: none;

            padding:
                9px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;

        }


        .edit-btn {

            background: #2563eb;

            color: #fff;

        }


        .delete-btn {

            background: #dc2626;

            color: #fff;

        }


        .view-btn {

            background: #333;

            color: #fff;

        }


        .message {

            padding: 15px;

            border-radius: 7px;

            margin-bottom: 20px;

            display: none;

        }


        .message.show {

            display: block;

        }


        .message.error {

            background: #fee2e2;

            color: #991b1b;

        }


        .message.success {

            background: #dcfce7;

            color: #166534;

        }


        .loading {

            text-align: center;

            padding: 50px 20px;

            color: #777;

        }


        @media (
            max-width: 600px
        ) {

            .manage-header {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }

        }

    </style>

</head>


<body>


<div class="manage-container">


    <div class="manage-header">

        <div>

            <h1>
                Manage Manga
            </h1>

            <p>
                Manage your MangaJPRaw library.
            </p>

        </div>


        <a
            href="./dashboard.html"
            class="back-button"
        >
            ← Dashboard
        </a>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="loading"
        class="loading"
    >
        Loading manga...
    </div>


    <div
        id="mangaGrid"
        class="manga-grid"
    ></div>


</div>


<script src="../js/manage-manga.js?v=1"></script>


</body>

</html>
