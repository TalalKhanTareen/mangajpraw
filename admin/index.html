<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MangaJPRaw Admin</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


<div class="admin-container">

    <div class="admin-card">

        <h1>
            MangaJPRaw
        </h1>

        <h2>
            Admin Panel
        </h2>

        <p class="subtitle">
            GitHub administration
        </p>


        <form id="loginForm">

            <label for="token">
                GitHub Admin Token
            </label>

            <input
                type="password"
                id="token"
                placeholder="Enter GitHub token"
                autocomplete="off"
                required
            >

            <p class="security-note">
                The token is stored only in this
                browser session. Never put your
                token inside a GitHub file.
            </p>

            <button type="submit">
                Login
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script>

    const form =
        document.getElementById(
            "loginForm"
        );


    const message =
        document.getElementById(
            "message"
        );


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const token =
                document
                    .getElementById("token")
                    .value
                    .trim();


            message.textContent =
                "Checking token...";

            message.className =
                "message";


            try {

                const response =
                    await fetch(
                        "https://api.github.com/user",
                        {

                            headers: {

                                "Authorization":
                                    "Bearer " +
                                    token,

                                "Accept":
                                    "application/vnd.github+json",

                                "X-GitHub-Api-Version":
                                    "2022-11-28"

                            }

                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Invalid GitHub token."
                    );

                }


                const user =
                    await response.json();


                if (
                    user.login.toLowerCase() !==
                    "talalkhantareen"
                ) {

                    throw new Error(
                        "This GitHub account is not authorized."
                    );

                }


                sessionStorage.setItem(
                    "mangajpraw_admin",
                    "true"
                );


                sessionStorage.setItem(
                    "mangajpraw_token",
                    token
                );


                sessionStorage.setItem(
                    "mangajpraw_user",
                    user.login
                );


                window.location.href =
                    "./dashboard.html";

            }

            catch (error) {

                console.error(
                    error
                );

                message.textContent =
                    error.message;

                message.className =
                    "message error";

            }

        }
    );

</script>


</body>

</html>
