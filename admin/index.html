<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MangaJPRaw Admin Login</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

<div class="admin-container">

    <div class="admin-card">

        <h1>
            MangaJPRaw
        </h1>

        <h2>
            Admin Panel
        </h2>

        <p class="subtitle">
            Authorized access only
        </p>


        <form id="loginForm">

            <label for="token">
                GitHub Admin Token
            </label>

            <input
                type="password"
                id="token"
                placeholder="Enter GitHub token"
                autocomplete="off"
                required
            >

            <div
                style="
                    color:#7f8da3;
                    font-size:12px;
                    margin-bottom:15px;
                    line-height:1.5;
                "
            >
                Your token is kept only in this browser
                session and is not written into the
                website files.
            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script>

    const form =
        document.getElementById(
            "loginForm"
        );


    const message =
        document.getElementById(
            "message"
        );


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const token =
                document
                    .getElementById("token")
                    .value
                    .trim();


            if (!token) {

                message.textContent =
                    "Please enter your token.";

                message.className =
                    "message error";

                return;

            }


            message.textContent =
                "Checking token...";

            message.className =
                "message";


            try {

                const response =
                    await fetch(
                        "https://api.github.com/user",
                        {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + token,

                                "Accept":
                                    "application/vnd.github+json",

                                "X-GitHub-Api-Version":
                                    "2022-11-28"

                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Invalid GitHub token."
                    );

                }


                const user =
                    await response.json();


                /*
                 * Only your GitHub account is
                 * allowed to use this admin panel.
                 */

                const allowedUser =
                    "TalalKhanTareen";


                if (
                    user.login.toLowerCase() !==
                    allowedUser.toLowerCase()
                ) {

                    throw new Error(
                        "This GitHub account is not authorized."
                    );

                }


                /*
                 * Store token only for this
                 * browser session.
                 */

                sessionStorage.setItem(
                    "mangajpraw_token",
                    token
                );


                sessionStorage.setItem(
                    "mangajpraw_admin",
                    "true"
                );


                sessionStorage.setItem(
                    "mangajpraw_user",
                    user.login
                );


                window.location.href =
                    "./dashboard.html";

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    error.message;

                message.className =
                    "message error";

            }

        }
    );

</script>

</body>

</html>
