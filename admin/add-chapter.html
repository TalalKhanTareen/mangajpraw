<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Chapter - MangaJPRaw Admin</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


<div class="admin-container">

    <div class="admin-card">

        <h1>
            Add Chapter
        </h1>

        <p class="subtitle">
            Add a new chapter to an existing manga
        </p>


        <form id="chapterForm">


            <!-- MANGA -->

            <label for="mangaSelect">
                Select Manga
            </label>

            <select
                id="mangaSelect"
                required
            >

                <option value="">
                    Loading manga...
                </option>

            </select>


            <!-- CHAPTER NUMBER -->

            <label for="chapterNumber">
                Chapter Number
            </label>

            <input
                type="number"
                id="chapterNumber"
                placeholder="Example: 1 or 1188"
                min="0"
                step="0.1"
                required
            >


            <!-- CHAPTER TITLE -->

            <label for="chapterTitle">
                Chapter Title
            </label>

            <input
                type="text"
                id="chapterTitle"
                placeholder="Example: The New Beginning"
            >


            <!-- DESCRIPTION -->

            <label for="chapterDescription">
                Description
            </label>

            <textarea
                id="chapterDescription"
                placeholder="Enter chapter description..."
            ></textarea>


            <!-- RELEASE DATE -->

            <label for="releaseDate">
                Release Date
            </label>

            <input
                type="date"
                id="releaseDate"
            >


            <!-- BUTTON -->

            <button
                type="submit"
                id="addChapterBtn"
            >
                Add Chapter
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


        </form>


        <br>


        <a href="./dashboard.html">
            ← Back to Dashboard
        </a>


    </div>


</div>


<!-- IMPORTANT: CACHE-BUSTING VERSION -->

<script
    src="../js/add-chapter.js?v=10"
></script>


</body>

</html>
