<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Chapter - Manga Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-container">

    <div class="admin-header">
        <div>
            <h1>Add Chapter</h1>
            <p>Add a new chapter to an existing manga.</p>
        </div>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>
    </div>


    <div class="admin-card">

        <form id="chapterForm">

            <!-- Manga -->

            <div class="form-group">

                <label for="mangaSelect">
                    Select Manga
                </label>

                <select id="mangaSelect" required>

                    <option value="">
                        Loading manga...
                    </option>

                </select>

            </div>


            <!-- Chapter Number -->

            <div class="form-group">

                <label for="chapterNumber">
                    Chapter Number
                </label>

                <input
                    type="number"
                    id="chapterNumber"
                    placeholder="Example: 1188"
                    min="0"
                    step="0.1"
                    required
                >

            </div>


            <!-- Chapter Title -->

            <div class="form-group">

                <label for="chapterTitle">
                    Chapter Title
                </label>

                <input
                    type="text"
                    id="chapterTitle"
                    placeholder="Example: The New Beginning"
                >

            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="chapterDescription">
                    Description
                </label>

                <textarea
                    id="chapterDescription"
                    placeholder="Enter chapter description..."
                ></textarea>

            </div>


            <!-- Date -->

            <div class="form-group">

                <label for="releaseDate">
                    Release Date
                </label>

                <input
                    type="date"
                    id="releaseDate"
                >

            </div>


            <button
                type="submit"
                id="addChapterBtn"
                class="primary-btn"
            >
                Add Chapter
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>

    </div>

</div>


<script src="../js/add-chapter.js"></script>

</body>
</html>
